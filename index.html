<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Incident 01: Visual Sync</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #hud { position: absolute; top: 20px; left: 20px; color: #44ff44; z-index: 10; pointer-events: none; }
        .ui-screen { position: absolute; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 100; color: #44ff44; text-align: center; }
        button { background: none; border: 1px solid #44ff44; color: #44ff44; padding: 10px 20px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #44ff44; color: #000; }
    </style>
</head>
<body>

<div id="start-screen" class="ui-screen">
    <div>
        <h2>SIGNAL RECOVERY</h2>
        <p>Environment: Pine Ridge Campsite</p>
        <button onclick="initGame()">RESTORE FEED</button>
    </div>
</div>

<div id="hud" style="display:none;">SIGNAL: <span id="vol">100%</span></div>

<script>
let scene, camera, renderer, entity, fireLight, isPlaying = false;
let keys = {}, yaw = 0, pitch = 0;

function initGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';

    // 1. Scene & Sky (Matching your picture's dark green/grey)
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020502); 
    scene.fog = new THREE.FogExp2(0x020502, 0.12);

    // 2. Camera Angle (Higher, looking down slightly)
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12); 
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 3. Ground (Ashy Brown needles)
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1410 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 4. Campfire (Orange Gloom)
    fireLight = new THREE.PointLight(0xff4400, 20, 15);
    fireLight.position.set(0, 1, 0);
    scene.add(fireLight);
    
    const fireCore = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: 0xff2200}));
    scene.add(fireCore);

    // 5. Trees (Silhouettes)
    for(let i=0; i<60; i++) {
        const tree = new THREE.Mesh(new THREE.ConeGeometry(1, 10, 4), new THREE.MeshStandardMaterial({color: 0x000000}));
        let a = Math.random() * Math.PI * 2;
        let d = 15 + Math.random() * 20;
        tree.position.set(Math.cos(a)*d, 5, Math.sin(a)*d);
        scene.add(tree);
    }

    // 6. The Beauty (Pale Entity)
    entity = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.5, 2), new THREE.MeshBasicMaterial({color: 0xeeeeee, transparent: true, opacity: 0.8}));
    entity.position.set(10, 1, 10);
    scene.add(entity);

    document.body.requestPointerLock();
    isPlaying = true;
    animate();
}

function animate() {
    requestAnimationFrame(animate);
    
    if (isPlaying) {
        // Flickering fire
        fireLight.intensity = 15 + Math.random() * 10;

        // Controls
        if (keys['KeyW']) camera.translateZ(-0.1);
        if (keys['KeyS']) camera.translateZ(0.1);

        // Slow Stalking AI
        let dir = new THREE.Vector3().subVectors(camera.position, entity.position).normalize();
        entity.position.add(dir.multiplyScalar(0.035)); // Slower approach
        entity.lookAt(camera.position.x, 1, camera.position.z);
    }

    renderer.render(scene, camera);
}

document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);
document.addEventListener('mousemove', e => {
    if (document.pointerLockElement) {
        yaw -= e.movementX * 0.002;
        pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.002));
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
    }
});
</script>
</body>
</html>
