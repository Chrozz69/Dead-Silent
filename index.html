<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dead Silent</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #44ff44; font-family: 'Courier New', monospace; overflow: hidden; }
        .ui-layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.92); z-index: 100; text-align: center; }
        .log-box { border: 1px solid #44ff44; padding: 40px; background: #000; min-width: 350px; box-shadow: 0 0 20px rgba(68, 255, 68, 0.2); }
        h1 { letter-spacing: 10px; margin-bottom: 30px; }
        button { background: transparent; color: #44ff44; border: 1px solid #44ff44; padding: 12px; margin: 8px; width: 260px; cursor: pointer; font-family: inherit; transition: 0.2s; text-transform: uppercase; }
        button:hover:not(:disabled) { background: #44ff44; color: #000; }
        button:disabled { border-color: #222; color: #222; cursor: not-allowed; }
        #subtitles { position: absolute; bottom: 15%; width: 100%; text-align: center; color: #fff; font-size: 1.3em; z-index: 50; text-shadow: 2px 2px 4px #000; pointer-events: none; padding: 0 20px; }
        #canvas-container { position: absolute; inset: 0; z-index: 1; }
        .setting-row { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        input[type=range] { accent-color: #44ff44; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="main-menu" class="ui-layer">
    <div class="log-box">
        <h1>DEAD SILENT</h1>
        <button onclick="showUI('chapter-select')">START</button><br>
        <button onclick="showUI('settings')">SETTING</button><br>
        <button onclick="window.close(); alert('Neural Link Severed.')">EXIT</button>
    </div>
</div>

<div id="settings" class="ui-layer" style="display:none">
    <div class="log-box">
        <h2>SETTING</h2>
        <div class="setting-row"><span>VOLUME</span><input type="range" id="vol-slider" value="50"></div>
        <div class="setting-row"><span>BRIGHTNESS</span><input type="range" id="bright-slider" value="70"></div>
        <button onclick="showUI('main-menu')">BACK</button>
    </div>
</div>

<div id="chapter-select" class="ui-layer" style="display:none">
    <div class="log-box">
        <h2>RECONSTRUCTION</h2>
        <button onclick="prepChapter(1)">CHAPTER 1</button><br>
        <button onclick="showWIP()">CHAPTER 2</button><br>
        <button disabled>CHAPTER 3 (SOON)</button><br>
        <button onclick="showUI('main-menu')">BACK</button>
    </div>
</div>

<div id="ch1-intro" class="ui-layer" style="display:none">
    <div class="log-box">
        <h2>CHAPTER 1</h2>
        <p style="color: #888;">Liam and the forest's beauty</p>
        <p id="story-text" style="font-size: 0.9em; max-width: 400px; margin: 20px auto;">[Loading Liam's Memories...]</p>
        <button onclick="startGameplay()">SYNCHRONIZE</button>
    </div>
</div>

<div id="subtitles"></div>

<script>
let scene, camera, renderer, entity, fireLight, ambientLight;
let gameState = "menu", encounterCount = 0;
let audioCtx, droneGain;

// UI LOGIC
function showUI(id) {
    document.querySelectorAll('.ui-layer').forEach(l => l.style.display = 'none');
    if(id !== 'none') document.getElementById(id).style.display = 'flex';
}

function showWIP() {
    alert("Work in Progress: Chapter 2 is currently being reconstructed.");
}

// 3D ENGINE
function initEngine() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000204);
    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Environment: Ground and Grass
    const ground = new THREE.Mesh(new THREE.CircleGeometry(20, 32), new THREE.MeshStandardMaterial({color: 0x0a0f0a}));
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Camping Objects
    const tent = new THREE.Mesh(new THREE.ConeGeometry(2, 2.5, 4), new THREE.MeshStandardMaterial({color: 0x102010}));
    tent.position.set(-5, 1.25, -4);
    scene.add(tent);

    const mark = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.8), new THREE.MeshStandardMaterial({color: 0x000000}));
    mark.position.set(2, 0.9, -2);
    scene.add(mark);

    fireLight = new THREE.PointLight(0xff4400, 4, 15);
    fireLight.position.set(0, 0.5, 0);
    scene.add(fireLight);

    entity = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2.2), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0}));
    scene.add(entity);

    animate();
}

function prepChapter(num) {
    showUI('ch1-intro');
    gameState = "intro";
    camera.position.set(0, 3, 10);
    camera.lookAt(0, 0, 0);
    document.getElementById('story-text').innerText = "Liam: 'We were just camping... making dinner. I didn't know the silence was a warning.'";
}

async function startGameplay() {
    showUI('none');
    gameState = "playing";
    camera.position.set(0, 1.7, 4); // First person POV
    camera.lookAt(0, 0.5, 0); // Looking at campfire

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    droneGain = audioCtx.createGain();
    const osc = audioCtx.createOscillator();
    osc.frequency.value = 45;
    osc.connect(droneGain).connect(audioCtx.destination);
    osc.start();
    droneGain.gain.value = 0.3;

    runLiamEvent();
}

async function runLiamEvent() {
    const sub = document.getElementById('subtitles');
    
    for(encounterCount = 1; encounterCount <= 3; encounterCount++) {
        // Step 1: Mute sound
        sub.innerText = "LIAM: 'Everything is going quiet... what's happening?'";
        await fadeVolume(0.001, 3500);
        
        // Step 2: Spawn and Turn Liam
        spawnEntity();
        const targetPos = entity.position.clone();
        camera.lookAt(targetPos);
        
        sub.innerText = encounterCount < 3 ? "LIAM: 'Wait, who is that? Hey! Are you okay?'" : "LIAM: 'There she is... why won't she answer me?'";
        
        await new Promise(r => setTimeout(r, 3000));
        entity.material.opacity = 0; // Beauty vanishes
        
        // Step 3: Sound returns
        sub.innerText = "LIAM: 'She vanished... and the crickets are back.'";
        await fadeVolume(0.3, 1500);
        await new Promise(r => setTimeout(r, 2000));
    }

    sub.innerText = "LIAM: 'I thought she was just a lost soul. I didn't know the threat was real until it was too late.'";
    setTimeout(() => location.reload(), 5000);
}

function spawnEntity() {
    const ang = Math.random() * Math.PI * 2;
    const dist = 6 + Math.random() * 4;
    entity.position.set(Math.cos(ang)*dist, 1.1, Math.sin(ang)*dist);
    entity.material.opacity = 0.7;
}

function fadeVolume(target, duration) {
    if(!droneGain) return;
    droneGain.gain.exponentialRampToValueAtTime(target, audioCtx.currentTime + duration/1000);
    return new Promise(r => setTimeout(r, duration));
}

function animate() {
    requestAnimationFrame(animate);
    if(gameState === "menu" || gameState === "intro") {
        scene.rotation.y += 0.005; // Spinning map review
    }
    if(fireLight) fireLight.intensity = (gameState === "playing" ? 3 : 1) + Math.random();
    renderer.render(scene, camera);
}

initEngine();
</script>
</body>
</html>
