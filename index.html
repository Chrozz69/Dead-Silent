<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Incident 01: Final Recovery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #44ff44; font-family: 'Courier New', monospace; overflow: hidden; }
        #hud { position: absolute; inset: 0; z-index: 50; padding: 30px; pointer-events: none; }
        .box { border: 1px solid #44ff44; background: rgba(0,0,0,0.85); padding: 15px; position: absolute; pointer-events: auto; }
        #top-left { top: 40px; left: 40px; width: 300px; }
        #bottom-msg { bottom: 150px; left: 50%; transform: translateX(-50%); width: 450px; text-align: center; }
        #radar-ui { position: absolute; bottom: 40px; right: 40px; text-align: right; }
        #radar-circle { width: 120px; height: 120px; border: 1px solid #44ff44; border-radius: 50%; position: relative; margin-top: 10px; }
        #blip { position: absolute; width: 5px; height: 5px; background: #ff0000; border-radius: 50%; top: 50%; left: 50%; box-shadow: 0 0 10px #ff0000; }
        button { background: none; border: 1px solid #44ff44; color: #44ff44; padding: 5px 15px; cursor: pointer; margin-top: 10px; font-family: inherit; }
        button:hover { background: #44ff44; color: #000; }
        .signal { position: absolute; top: 40px; right: 40px; font-size: 1.2em; }
    </style>
</head>
<body>

<div id="hud">
    <div class="signal">SIGNAL: AUDIO <span id="vol-text" style="color: #ff3333">100%</span></div>
    
    <div id="top-left" class="box">
        <h3 style="margin:0;">INCIDENT 01: RECOVERY</h3>
        <p style="font-size:0.85em">Visual fidelity: Upgraded.</p>
        <button onclick="startGame()">INITIALIZE FEED</button>
    </div>

    <div id="bottom-msg" class="box" style="display:none;">
        <p id="narrative-text">"The ground felt like ash..."</p>
        <button onclick="closeUI()">CONTINUE</button>
    </div>

    <div id="radar-ui">
        <span>entity-blip</span>
        <div id="radar-circle"><div id="blip"></div></div>
    </div>
</div>

<script>
let scene, camera, renderer, fireLight, entity, isPlaying = false;
let keys = {}, yaw = 0, pitch = 0, audioVol = 100;

function startGame() {
    document.getElementById('top-left').style.display = 'none';
    document.getElementById('bottom-msg').style.display = 'block';
}

function closeUI() {
    document.getElementById('bottom-msg').style.display = 'none';
    document.body.requestPointerLock();
    isPlaying = true;
}

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.FogExp2(0x080808, 0.1);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 12);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Ground Circle
    const ground = new THREE.Mesh(
        new THREE.CircleGeometry(15, 64), 
        new THREE.MeshStandardMaterial({ color: 0x1a1410 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Fire
    fireLight = new THREE.PointLight(0xff6600, 2, 25);
    fireLight.position.set(0, 1, 0);
    scene.add(fireLight);

    // Trees
    for(let i=0; i<70; i++) {
        const tree = new THREE.Mesh(new THREE.ConeGeometry(1, 12, 4), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        let a = Math.random() * Math.PI * 2, d = 16 + Math.random() * 20;
        tree.position.set(Math.cos(a)*d, 6, Math.sin(a)*d);
        scene.add(tree);
    }

    // The Beauty
    entity = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 2), new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
    entity.position.set(10, 1, -5);
    scene.add(entity);

    animate();
}

function animate() {
    requestAnimationFrame(animate);
    if(fireLight) fireLight.intensity = 2 + Math.random() * 0.5;

    if(isPlaying) {
        if (keys['KeyW']) camera.translateZ(-0.1);
        if (keys['KeyS']) camera.translateZ(0.1);

        // Entity Stalking
        let dist = camera.position.distanceTo(entity.position);
        let dir = new THREE.Vector3().subVectors(camera.position, entity.position).normalize();
        entity.position.add(dir.multiplyScalar(0.04)); 
        entity.lookAt(camera.position.x, 1, camera.position.z);

        // Update Radar
        const blip = document.getElementById('blip');
        blip.style.left = (50 + (entity.position.x - camera.position.x) * 3) + '%';
        blip.style.top = (50 + (entity.position.z - camera.position.z) * 3) + '%';

        if(dist < 2) {
            isPlaying = false;
            alert("LINK SEVERED: SHE FOUND YOU");
            location.reload();
        }
    }
    renderer.render(scene, camera);
}

document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);
document.addEventListener('mousemove', e => {
    if (document.pointerLockElement) {
        yaw -= e.movementX * 0.002;
        pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.002));
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
    }
});

init();
</script>
</body>
</html>
