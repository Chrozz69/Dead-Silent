<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Incident 01: Night Texture</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #44ff44; font-family: 'Courier New', monospace; overflow: hidden; }
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 50; padding: 30px; }
        .box { border: 1px solid #44ff44; background: rgba(0,0,0,0.8); padding: 15px; position: absolute; }
        #top-left { top: 40px; left: 40px; width: 300px; }
        #bottom-right { bottom: 150px; left: 50%; transform: translateX(-50%); width: 400px; }
        #radar-ui { position: absolute; bottom: 40px; right: 40px; text-align: right; }
        #radar-circle { width: 120px; height: 120px; border: 1px solid #44ff44; border-radius: 50%; position: relative; margin-top: 10px; }
        #blip { position: absolute; width: 4px; height: 4px; background: #ff0000; border-radius: 50%; top: 50%; left: 50%; box-shadow: 0 0 10px #ff0000; }
        button { background: none; border: 1px solid #44ff44; color: #44ff44; padding: 5px 15px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #44ff44; color: #000; }
        .signal { position: absolute; top: 40px; right: 40px; font-size: 1.2em; }
    </style>
</head>
<body>

<div id="hud">
    <div class="signal">SIGNAL: AUDIO <span style="color: #ff3333">100%</span></div>
    
    <div id="top-left" class="box">
        <h3 style="margin:0; color:#44ff44">INCIDENT 01: NIGHT TEXTURE</h3>
        <p style="font-size:0.9em">Visual fidelity: Upgraded.</p>
        <p style="font-size:0.8em; color:#fff">"LIAM: Every tree felt like a thousand eyes watching me."</p>
        <button>CONTINUE</button>
    </div>

    <div id="bottom-right" class="box">
        <p style="font-size:0.8em; color:#fff; margin:0">"LIAM: The dry ground was thin and felt like ash under my feet. That was a memory."</p>
        <button>CONTINUE</button>
    </div>

    <div id="radar-ui">
        <span>entity-blip</span>
        <div id="radar-circle"><div id="blip"></div></div>
    </div>
</div>

<script>
let scene, camera, renderer, fireLight, entity;

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    // Thick grey fog for that "misty forest" look
    scene.fog = new THREE.FogExp2(0x0a0a0a, 0.08);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 18);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // GROUND: Using a circular geometry with an ashy texture
    const groundCanvas = document.createElement('canvas');
    groundCanvas.width = 512; groundCanvas.height = 512;
    const gCtx = groundCanvas.getContext('2d');
    gCtx.fillStyle = '#1a1410'; gCtx.fillRect(0,0,512,512);
    for(let i=0; i<4000; i++) {
        gCtx.fillStyle = Math.random() > 0.5 ? '#241c16' : '#0a0807';
        gCtx.fillRect(Math.random()*512, Math.random()*512, 2, 8);
    }
    const groundTex = new THREE.CanvasTexture(groundCanvas);
    const ground = new THREE.Mesh(
        new THREE.CircleGeometry(12, 64), 
        new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // FIRE
    const fireGeo = new THREE.SphereGeometry(0.2);
    const fireMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
    const fire = new THREE.Mesh(fireGeo, fireMat);
    fire.position.y = 0.5;
    scene.add(fire);

    fireLight = new THREE.PointLight(0xff6600, 2, 20);
    fireLight.position.set(0, 1.5, 0);
    scene.add(fireLight);

    // TREES: Dark silhouettes in the fog
    for(let i=0; i<60; i++) {
        const tree = new THREE.Mesh(
            new THREE.ConeGeometry(1.5, 12, 4),
            new THREE.MeshStandardMaterial({ color: 0x000000 })
        );
        let angle = Math.random() * Math.PI * 2;
        let dist = 14 + Math.random() * 20;
        tree.position.set(Math.cos(angle)*dist, 6, Math.sin(angle)*dist);
        scene.add(tree);
    }

    // THE BEAUTY (Entity)
    entity = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.6, 2.5),
        new THREE.MeshStandardMaterial({ color: 0xcccccc })
    );
    entity.position.set(4, 1.25, -2);
    scene.add(entity);

    animate();
}

function animate() {
    requestAnimationFrame(animate);
    // Fire flicker
    if(fireLight) fireLight.intensity = 1.8 + Math.random() * 0.5;
    
    // Update radar blip based on entity position
    const blip = document.getElementById('blip');
    if(blip && entity) {
        blip.style.left = (50 + entity.position.x * 4) + '%';
        blip.style.top = (50 + entity.position.z * 4) + '%';
    }

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
