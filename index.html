<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dead Silent</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #44ff44; font-family: 'Courier New', monospace; overflow: hidden; }
        .ui-layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.95); z-index: 100; text-align: center; }
        .log-box { border: 1px solid #44ff44; padding: 40px; background: #000; min-width: 350px; }
        h1 { letter-spacing: 8px; margin-bottom: 30px; }
        button { background: transparent; color: #44ff44; border: 1px solid #44ff44; padding: 12px; margin: 8px; width: 260px; cursor: pointer; font-family: inherit; transition: 0.2s; }
        button:hover:not(:disabled) { background: #44ff44; color: #000; }
        button:disabled { border-color: #222; color: #222; cursor: not-allowed; }
        #subtitles { position: absolute; bottom: 15%; width: 100%; text-align: center; color: #fff; font-size: 1.3em; z-index: 50; text-shadow: 2px 2px 2px #000; pointer-events: none; }
        #canvas-container { position: absolute; inset: 0; z-index: 1; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="main-menu" class="ui-layer">
    <div class="log-box">
        <h1>DEAD SILENT</h1>
        <button onclick="showUI('chapter-select')">START</button><br>
        <button onclick="showUI('settings')">SETTING</button><br>
        <button onclick="alert('Exit successful.')">EXIT</button>
    </div>
</div>

<div id="settings" class="ui-layer" style="display:none">
    <div class="log-box">
        <h2>SETTING</h2>
        <p>VOLUME: <input type="range" id="vol" value="50"></p>
        <p>LIGHTING: <input type="range" id="bright" value="70"></p>
        <button onclick="showUI('main-menu')">BACK</button>
    </div>
</div>

<div id="chapter-select" class="ui-layer" style="display:none">
    <div class="log-box">
        <h2>RECONSTRUCTION</h2>
        <button onclick="prepChapter1()">CHAPTER 1</button><br>
        <button onclick="showWIP()">CHAPTER 2</button><br>
        <button disabled>CHAPTER 3 (COMING SOON)</button><br>
        <button onclick="showUI('main-menu')">BACK</button>
    </div>
</div>

<div id="ch1-intro" class="ui-layer" style="display:none">
    <div class="log-box">
        <h2>CHAPTER 1</h2>
        <p style="color: #888;">Liam and the forest's beauty</p>
        <button onclick="startGameplay()">SYNCHRONIZE</button>
    </div>
</div>

<div id="subtitles"></div>

<script>
let scene, camera, renderer, entity, fireLight, isPlaying = false;
let audioCtx, droneGain, gameState = "menu";

function showUI(id) {
    document.querySelectorAll('.ui-layer').forEach(l => l.style.display = 'none');
    document.getElementById(id).style.display = 'flex';
    gameState = (id === 'main-menu') ? "menu" : "ui";
}

function showWIP() {
    const box = document.querySelector('#chapter-select .log-box');
    const oldContent = box.innerHTML;
    box.innerHTML = "<h2>WORK IN PROGRESS</h2><button onclick='location.reload()'>BACK</button>";
}

function initEngine() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000204);
    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Camp Map (Spinning in background)
    const ground = new THREE.Mesh(new THREE.CircleGeometry(15, 32), new THREE.MeshStandardMaterial({color: 0x111111}));
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    fireLight = new THREE.PointLight(0xff4400, 4, 15);
    fireLight.position.set(0, 0.5, 0);
    scene.add(fireLight);

    entity = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0}));
    scene.add(entity);

    animate();
}

function prepChapter1() {
    showUI('ch1-intro');
    gameState = "intro";
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);
}

async function startGameplay() {
    showUI('none');
    gameState = "playing";
    
    // Setup Audio
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    droneGain = audioCtx.createGain();
    const osc = audioCtx.createOscillator();
    osc.frequency.value = 50;
    osc.connect(droneGain).connect(audioCtx.destination);
    osc.start();
    
    runLiamSequence();
}

async function runLiamSequence() {
    const sub = document.getElementById('subtitles');
    
    for(let i=1; i<=3; i++) {
        // 1. Mute Volume
        sub.innerText = "LIAM: 'The woods are going quiet... Sarah? Anyone?'";
        await fadeVolume(0, 3000);
        
        // 2. Spawn & Look
        spawnEntity();
        camera.lookAt(entity.position);
        sub.innerText = i === 1 ? "LIAM: 'Who's that? A girl? Hey!'" : "LIAM: 'There she is again... how is she moving so fast?'";
        
        await new Promise(r => setTimeout(r, 2500));
        entity.material.opacity = 0; // Vanish
        
        // 3. Return Sound
        sub.innerText = "LIAM: 'She's gone. The sound is back...'";
        await fadeVolume(0.2, 1000);
        await new Promise(r => setTimeout(r, 2000));
    }

    sub.innerText = "LIAM: 'I thought it was just a weird night. I didn't know the threat was real.'";
    setTimeout(() => location.reload(), 4000);
}

function spawnEntity() {
    const ang = Math.random() * Math.PI * 2;
    entity.position.set(Math.cos(ang)*7, 1, Math.sin(ang)*7);
    entity.material.opacity = 0.6;
}

function fadeVolume(target, duration) {
    if(!droneGain) return;
    droneGain.gain.exponentialRampToValueAtTime(target + 0.001, audioCtx.currentTime + duration/1000);
    return new Promise(r => setTimeout(r, duration));
}

function animate() {
    requestAnimationFrame(animate);
    if(gameState === "menu" || gameState === "intro") {
        scene.rotation.y += 0.005;
    }
    renderer.render(scene, camera);
}

initEngine();
</script>
</body>
</html>
